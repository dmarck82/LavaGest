<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes | LavaGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-body-tertiary" data-pagina="clientes">
    <header class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a href="clientes.html" class="navbar-brand">
                <i class="bi bi-droplet-fill me-2"></i>
                LavaGest
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu-principal" aria-controls="menu-principal"
                aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div id="menu-principal" class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" data-menu="clientes" href="clientes.html">
                            <i class="bi bi-people me-1"></i>
                            Clientes
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" data-menu="usuarios" href="usuarios.html">
                            <i class="bi bi-person-gear me-1"></i>
                            Usuários
                        </a>
                    </li>
                </ul>

                <button id="botao-sair" type="button" class="btn btn-outline-light btn-sm mt-2 mt-lg-0">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Sair
                </button>
            </div>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">Clientes</h1>
                <p class="text-secondary mb-0">
                    Gerencie os clientes atendidos pelo lava jato.
                </p>
            </div>

            <button id="botao-novo-cliente" type="button" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i>
                Novo cliente
            </button>
        </div>

        <div id="mensagem" class="alert d-none" role="alert"></div>

        <section class="card border-0 shadow-sm">
            <div class="card-body border-bottom">
                <label for="busca" class="visually-hidden">Buscar cliente</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-search" aria-hidden="true"></i>
                    </span>
                    <input id="busca" type="search" class="form-control"
                        placeholder="Buscar por nome, WhatsApp ou cidade">
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Cliente</th>
                            <th scope="col">WhatsApp</th>
                            <th scope="col">Telefone</th>
                            <th scope="col">Cidade</th>
                            <th scope="col">Cadastro</th>
                            <th scope="col" class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-clientes">
                        <tr>
                            <td colspan="7" class="text-center py-4">
                                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                                Carregando clientes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modal-cliente" tabindex="-1" aria-labelledby="titulo-modal-cliente" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formulario-cliente">
                    <div class="modal-header">
                        <h2 id="titulo-modal-cliente" class="modal-title fs-5">Novo cliente</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>

                    <div class="modal-body">
                        <div id="mensagem-modal" class="alert d-none" role="alert"></div>

                        <div class="row g-3">
                            <div class="col-12">
                                <label for="nome" class="form-label">Nome</label>
                                <input id="nome" type="text" class="form-control" required autocomplete="name">
                            </div>
                            <div class="col-md-6">
                                <label for="whatsapp" class="form-label">WhatsApp</label>
                                <input id="whatsapp" type="tel" class="form-control" required autocomplete="tel">
                            </div>
                            <div class="col-md-6">
                                <label for="telefone" class="form-label">Telefone</label>
                                <input id="telefone" type="tel" class="form-control" autocomplete="tel">
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label">E-mail</label>
                                <input id="email" type="email" class="form-control" autocomplete="email">
                            </div>
                            <div class="col-md-4">
                                <label for="cep" class="form-label">CEP</label>
                                <input id="cep" type="text" inputmode="numeric" class="form-control"
                                    autocomplete="postal-code">
                                <div id="status-cep" class="form-text" aria-live="polite"></div>
                            </div>
                            <div class="col-md-2">
                                <label for="uf" class="form-label">UF</label>
                                <input id="uf" type="text" maxlength="2" class="form-control text-uppercase">
                            </div>
                            <div class="col-md-6">
                                <label for="cidade" class="form-label">Cidade</label>
                                <input id="cidade" type="text" class="form-control">
                            </div>
                            <div class="col-md-8">
                                <label for="endereco" class="form-label">Endereço</label>
                                <input id="endereco" type="text" class="form-control" autocomplete="street-address">
                            </div>
                            <div class="col-md-4">
                                <label for="bairro" class="form-label">Bairro</label>
                                <input id="bairro" type="text" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            Salvar cliente
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/navegacao.js"></script>
    <script type="module" src="js/clientes.js"></script>
</body>

</html>
