<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Usuários | PHP POO API</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-body-tertiary">
    <header class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a href="usuarios.html" class="navbar-brand">
                <i class="bi bi-boxes me-2"></i>
                PHP POO API
            </a>

            <button id="botao-sair" type="button" class="btn btn-outline-light btn-sm">
                <i class="bi bi-box-arrow-right me-1"></i>
                Sair
            </button>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Usuários</h1>
                <p class="text-secondary mb-0">
                    Gerencie os usuários cadastrados na API.
                </p>
            </div>

            <button id="botao-novo-usuario" type="button" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>
                Novo usuário
            </button>
        </div>

        <div id="mensagem" class="alert d-none" role="alert"></div>

        <section class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nome</th>
                            <th scope="col">E-mail</th>
                            <th scope="col">Telefone</th>
                            <th scope="col">Último login</th>
                            <th scope="col" class="text-end">Ações</th>
                        </tr>
                    </thead>

                    <tbody id="lista-usuarios">
                        <tr>
                            <td colspan="6" class="text-center py-4">
                                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                                Carregando usuários...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modal-usuario" tabindex="-1" aria-labelledby="titulo-modal-usuario" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formulario-usuario">
                    <div class="modal-header">
                        <h2 id="titulo-modal-usuario" class="modal-title fs-5">
                            Novo usuário
                        </h2>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>

                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="nome" class="form-label">
                                Nome
                            </label>

                            <input id="nome" type="text" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                E-mail
                            </label>

                            <input id="email" type="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="telefone" class="form-label">
                                Telefone
                            </label>

                            <input id="telefone" type="tel" class="form-control" required>
                        </div>

                        <div id="campo-senha" class="mb-0">
                            <label for="senha" class="form-label">
                                Senha
                            </label>

                            <input id="senha" type="password" class="form-control" minlength="8" required>

                            <div class="form-text">
                                A senha deve ter pelo menos 8 caracteres.
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            Salvar usuário
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/usuarios.js"></script>
</body>

</html>
