<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veículos | LavaGest</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body class="bg-body-tertiary" data-pagina="veiculos">
    <header class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a href="/veiculos" class="navbar-brand"><i class="bi bi-droplet-fill me-2"></i>LavaGest</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="menu-principal" class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" data-menu="clientes" href="/clientes"><i
                                class="bi bi-people me-1"></i>Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" data-menu="veiculos" href="/veiculos"><i
                                class="bi bi-car-front me-1"></i>Veículos</a></li>
                    <li class="nav-item"><a class="nav-link" data-menu="usuarios" href="/usuarios"><i
                                class="bi bi-person-gear me-1"></i>Usuários</a></li>
                </ul>
                <button id="botao-sair" type="button" class="btn btn-outline-light btn-sm mt-2 mt-lg-0"><i
                        class="bi bi-box-arrow-right me-1"></i>Sair</button>
            </div>
        </div>
    </header>

    <main class="container py-4 py-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h1 class="h3 mb-1">Veículos</h1>
                <p class="text-secondary mb-0">Gerencie os veículos dos clientes.</p>
            </div>
            <button id="botao-novo-veiculo" type="button" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Novo
                veículo</button>
        </div>
        <div id="mensagem" class="alert d-none" role="alert"></div>
        <section class="card border-0 shadow-sm">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Placa</th>
                            <th>Veículo</th>
                            <th>Categoria</th>
                            <th>Cliente</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="lista-veiculos">
                        <tr>
                            <td colspan="5" class="text-center py-4">Carregando veículos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal fade" id="modal-veiculo" tabindex="-1" aria-labelledby="titulo-modal-veiculo" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formulario-veiculo">
                    <div class="modal-header">
                        <h2 id="titulo-modal-veiculo" class="modal-title fs-5">Novo veículo</h2><button type="button"
                            class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <div id="mensagem-modal" class="alert d-none" role="alert"></div>
                        <div class="row g-3">
                            <div class="col-12"><label for="cliente-id" class="form-label">Cliente</label><select
                                    id="cliente-id" class="form-select" required>
                                    <option value="">Selecione um cliente</option>
                                </select></div>
                            <div class="col-md-4"><label for="placa" class="form-label">Placa</label><input id="placa"
                                    type="text" maxlength="8" class="form-control text-uppercase" placeholder="ABC-1D23"
                                    required></div>
                            <div class="col-md-4"><label for="tipo-veiculo" class="form-label">Tipo</label><select
                                    id="tipo-veiculo" class="form-select" required>
                                    <option value="carros">Carro</option>
                                    <option value="motos">Moto</option>
                                    <option value="caminhoes">Caminhão</option>
                                </select></div>
                            <div class="col-md-4"><label for="marca" class="form-label">Marca</label><input id="marca"
                                    type="text" class="form-control" list="lista-marcas"
                                    placeholder="Selecione ou informe a marca" required><datalist
                                    id="lista-marcas"></datalist></div>
                            <div class="col-md-8"><label for="modelo" class="form-label">Modelo</label><input
                                    id="modelo" type="text" class="form-control" list="lista-modelos"
                                    placeholder="Selecione ou informe o modelo" required><datalist
                                    id="lista-modelos"></datalist></div>
                            <div class="col-md-4"><label for="categoria" class="form-label">Categoria</label><select
                                    id="categoria" class="form-select" required>
                                    <option value="">Selecione</option>
                                    <option value="moto">Moto</option>
                                    <option value="compacto">Compacto</option>
                                    <option value="hatch">Hatch</option>
                                    <option value="sedan">Sedan</option>
                                    <option value="suv">SUV</option>
                                    <option value="caminhonete">Caminhonete</option>
                                    <option value="van">Van</option>
                                </select></div>
                            <div class="col-md-4"><label for="cor" class="form-label">Cor</label><input id="cor"
                                    type="text" class="form-control"></div>
                            <div class="col-md-4"><label for="ano-fabricacao" class="form-label">Ano de
                                    fabricação</label><input id="ano-fabricacao" type="number" min="1886"
                                    class="form-control"></div>
                            <div class="col-12"><label for="observacoes" class="form-label">Observações</label><textarea
                                    id="observacoes" class="form-control" rows="3"></textarea></div>
                        </div>
                    </div>
                    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary"><i
                                class="bi bi-check-lg me-1"></i>Salvar veículo</button></div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/navegacao.js"></script>
    <script type="module" src="/js/veiculos.js"></script>
</body>

</html>
