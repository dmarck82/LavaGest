<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PHP POO API Estudos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-body-tertiary">
    <main class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <section class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="bi bi-boxes fs-1 text-primary"></i>

                            <h1 class="h3 mt-3 mb-1">
                                PHP POO API
                            </h1>

                            <p class="text-secondary mb-0">
                                Entre para acessar os usuários.
                            </p>
                        </div>

                        <div id="mensagem" class="alert d-none" role="alert"></div>

                        <form id="formulario-login">
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    E-mail
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope"></i>
                                    </span>

                                    <input type="email" class="form-control" id="email" name="email"
                                        placeholder="voce@exemplo.com" autocomplete="email" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="senha" class="form-label">
                                    Senha
                                </label>

                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock"></i>
                                    </span>

                                    <input type="password" class="form-control" id="senha" name="senha"
                                        autocomplete="current-password" required>
                                </div>
                            </div>

                            <button id="botao-entrar" type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-1"></i>
                                Entrar
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/autenticacao.js"></script>
</body>

</html>
